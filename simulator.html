<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Simulator - HealthcareML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">Patient Simulator</h1>
        <div class="row">
            <div class="col-md-4">
                <button id="generate-patient" type="button" class="btn btn-primary btn-lg w-100 mb-4">
                    Generate Random Patient
                </button>
            </div>
            <div class="col-md-8">
                <div id="patient-simulator-results">
                    <div class="text-center py-5">
                        <h5>No Patient Generated Yet</h5>
                        <p class="text-muted">Click the button to create a virtual patient profile.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Make sure this path is correct! -->
    <script src="assets/js/main.js"></script>
</body>
</html>
